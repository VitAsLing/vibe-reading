name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Package browser builds
        run: pnpm zip:all

      - name: Validate release package versions
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync, readdirSync } from "node:fs";

          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (process.env.GITHUB_REF_TYPE === "tag") {
            assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, "Release tag must match package.json");
          }

          const files = readdirSync(".output");
          for (const target of ["chrome", "edge", "firefox", "sources"]) {
            const packages = files.filter(file => file.endsWith(`-${target}.zip`));
            assert.equal(packages.length, 1, `Expected one ${target} package`);
            const file = packages[0];
            assert.ok(file.endsWith(`-${version}-${target}.zip`), `${target} package filename must match package.json`);
            const metadata = JSON.parse(execFileSync("unzip", ["-p", `.output/${file}`, target === "sources" ? "package.json" : "manifest.json"], { encoding: "utf8" }));
            assert.equal(metadata.version, version, `${target} package version must match package.json`);
          }
          NODE

      - name: Install lifecycle E2E browser
        id: lifecycle_setup
        run: pnpm exec playwright install --with-deps chromium

      - name: Extension lifecycle E2E - bilingual
        shell: bash
        run: |
          mkdir -p .output/acceptance/extension-lifecycle/bilingual
          pnpm e2e:extension .output/chrome-mv3 .output/acceptance/extension-lifecycle/bilingual \
            2>&1 | tee .output/acceptance/extension-lifecycle/bilingual/run.log

      - name: Extension lifecycle E2E - translation only
        if: ${{ !cancelled() && steps.lifecycle_setup.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .output/acceptance/extension-lifecycle/translation-only
          pnpm e2e:extension .output/chrome-mv3 .output/acceptance/extension-lifecycle/translation-only --translation-only \
            2>&1 | tee .output/acceptance/extension-lifecycle/translation-only/run.log

      - name: Native foreground, background and frozen reload E2E
        if: ${{ !cancelled() && steps.lifecycle_setup.outcome == 'success' }}
        shell: bash
        run: |
          for mode in bilingual translation-only; do
            args=()
            if [ "$mode" = "translation-only" ]; then
              args+=(--translation-only)
            fi
            directory=".output/acceptance/extension-lifecycle/native-$mode"
            mkdir -p "$directory"
            E2E_NATIVE_VISIBILITY=1 pnpm e2e:extension .output/chrome-mv3 "$directory" \
              --case=visible-pending-reload-recovery,hidden-pending-reload-recovery,hidden-frozen-page-reload-recovery,live-channel-failure-stays-visible-and-recovers,pending-error-hydration-survives-frozen-reload,audit-provider-message-canonical,audit-provider-message-embedded,audit-rapid-reloads-pending-manual,audit-disable-enable-pending-manual,audit-bootstrap-resource-cancel-after-reload,audit-pending-manager-receiver-reload \
              "${args[@]}" 2>&1 | tee "$directory/run.log"
          done

      - name: Upload lifecycle E2E artifacts
        if: ${{ always() && steps.lifecycle_setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-lifecycle
          path: .output/acceptance/extension-lifecycle/
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: |
            .output/*-chrome.zip
            .output/*-edge.zip
            .output/*-firefox.zip
            .output/*-sources.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "::error::Release tag ${TAG_NAME} already exists. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "$TAG_NAME"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Download extension packages
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
        run: |
          mapfile -t ZIP_FILES < <(find release-artifacts -type f -name '*.zip' | sort)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "No packaged extension zip files found." >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "${ZIP_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --generate-notes
