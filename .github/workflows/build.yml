name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package browser builds
        run: pnpm zip:all

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/**/*.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download extension packages
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t ZIP_FILES < <(find release-artifacts -type f -name '*.zip' | sort)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "No packaged extension zip files found." >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "${ZIP_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --generate-notes
