name: Release Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild assets for (e.g., v1.34.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Upload release assets
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package browser builds
        run: pnpm zip:all

      - name: Upload extension packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            .output/*-chrome.zip \
            .output/*-edge.zip \
            .output/*-firefox.zip \
            .output/*-sources.zip \
            --clobber
